<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>徳を積め！</title>
<meta name="description" content="徳を積んで立派な人間に成長しよう！「得」「特」を積んだら即終了。">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.png" type="image/png" sizes="192x192">
<meta property="og:type" content="website">
<meta property="og:site_name" content="徳を積め！">
<meta property="og:title" content="徳を積め！">
<meta property="og:description" content="徳を積んで立派な人間に成長しよう！「得」「特」を積んだら即終了。">
<meta property="og:url" content="https://game.chozo.net/toku/">
<meta property="og:image" content="https://game.chozo.net/toku/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="金色の「徳」の字を東京タワーの高さまで積み上げたゲーム画面と、タイトル「徳を積め！」">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <div id="hudCount"><span class="toku">徳</span><b id="count">0</b></div>
      <div id="hudAlt">0 m</div>
    </div>
    <div id="hudNext"></div>
  </div>

  <div id="title" class="screen">
    <div class="logo"><span>徳</span>を積め！</div>
    <p class="lead">徳を積んで<br>立派な人間に成長しよう！</p>
    <button id="btnStart" class="btn">徳を積む</button>
    <p id="best" class="best"></p>
  </div>

  <div id="result" class="screen hidden">
    <p id="reason" class="reason"></p>
    <p class="label">あなたの称号</p>
    <div id="rank" class="rank"></div>
    <p id="reach" class="reach"></p>
    <div class="stats">
      <div><small>積んだ徳</small><b id="rCount">0</b></div>
      <div><small>高さ</small><b id="rAlt">0 m</b></div>
    </div>
    <button id="btnRetry" class="btn">もう一度積む</button>
    <button id="btnTitle" class="btn sub">タイトルへ</button>
  </div>
</div>
<script src="./game.js"></script>
</body>
</html>
